<div class="page">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="mb-1">Suivi du temps</h1>
        <p class="text-muted mb-0">Enregistrez vos heures par rapport</p>
      </div>
      <a routerLink="/home" class="btn btn-outline-secondary btn-sm">← Accueil</a>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>

    <div class="row g-4">
      <div class="col-lg-5">
        <div class="card-form">
          <h5 class="mb-3">Nouvelle saisie</h5>
          <form [formGroup]="form" (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Rapport</label>
              <select class="form-select" formControlName="reportReference">
                <option value="">-- Choisir --</option>
                <option *ngFor="let r of reports" [value]="r.reference">
                  {{ r.reference }} — {{ r.title }}
                </option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Date</label>
              <input type="date" class="form-control" formControlName="entryDate">
            </div>
            <div class="mb-3">
              <label class="form-label">Heures</label>
              <input type="number" step="0.25" class="form-control" formControlName="hoursSpent">
            </div>
            <div class="mb-3">
              <label class="form-label">Commentaire</label>
              <input class="form-control" formControlName="comment">
            </div>
            <button class="btn btn-primary" type="submit" [disabled]="saving || form.invalid">
              {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
          </form>
        </div>
      </div>
      <div class="col-lg-7">
        <div class="card-form">
          <h5 class="mb-3">Historique</h5>
          <div *ngIf="loading" class="text-center py-4"><div class="spinner-border"></div></div>
          <div class="entry" *ngFor="let e of entries">
            <div class="entry-ref">{{ e.reportReference }}</div>
            <div class="entry-title">{{ e.reportTitle }}</div>
            <div class="entry-meta">{{ e.entryDate }} · {{ e.hoursSpent }} h</div>
            <div class="text-muted small" *ngIf="e.comment">{{ e.comment }}</div>
          </div>
          <p class="text-muted" *ngIf="!loading && entries.length === 0">Aucune saisie pour le moment.</p>
        </div>
      </div>
    </div>
  </div>
</div>
