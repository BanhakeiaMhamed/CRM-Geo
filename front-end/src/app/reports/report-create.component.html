<div class="page">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>Nouveau rapport</h1>
      <a routerLink="/kanban" class="btn btn-outline-secondary btn-sm">← Kanban</a>
    </div>

    <div class="card-form">
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
      <div class="alert alert-success" *ngIf="success">{{ success }}</div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Titre</label>
          <input class="form-control" formControlName="title" placeholder="Etude geotechnique Lot A">
        </div>
        <div class="mb-3">
          <label class="form-label">Reference</label>
          <input class="form-control" formControlName="reference">
        </div>
        <div class="mb-3">
          <label class="form-label">Type de mission</label>
          <select class="form-select" formControlName="reportType">
            <optgroup *ngFor="let group of typeGroups" [label]="group.label">
              <option *ngFor="let t of group.types" [value]="t">{{ typeLabels[t] }}</option>
            </optgroup>
          </select>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <label class="form-label">Adresse *</label>
            <input class="form-control" formControlName="address" placeholder="12 rue de la Republique">
          </div>
          <div class="col-md-3">
            <label class="form-label">Code postal *</label>
            <input class="form-control" formControlName="postalCode" placeholder="69002">
          </div>
          <div class="col-md-3">
            <label class="form-label">Ville *</label>
            <input class="form-control" formControlName="city" placeholder="Lyon">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Montant prevu (€)</label>
          <input class="form-control" type="number" formControlName="revenueAmount" min="0">
        </div>
        <div class="mb-3">
          <label class="form-label">PDF du rapport (optionnel)</label>
          <input class="form-control" type="file" accept="application/pdf,.pdf" (change)="onPdfChange($event)">
          <div class="form-text">Vous pourrez aussi joindre le PDF depuis le Kanban avant validation.</div>
        </div>
        <button class="btn btn-primary" type="submit" [disabled]="loading">
          {{ loading ? 'Creation...' : 'Creer le rapport' }}
        </button>
      </form>
    </div>
  </div>
</div>
