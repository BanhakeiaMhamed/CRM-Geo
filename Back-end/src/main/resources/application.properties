spring.application.name=Back-end
server.port=8081

# Spring Datasource Configuration
spring.datasource.password=123
spring.datasource.url=jdbc:postgresql://localhost:5432/crm-db
spring.datasource.username=postgres

# Spring JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

spring.main.banner-mode=console

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db/changelog.yaml

# Firebase Admin SDK
# Place your service account JSON at this path or set FIREBASE_CREDENTIALS_PATH env var
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:firebase-service-account.json}

# Demo data (injecte au demarrage pour tests UI)
crm.demo.enabled=true

# CORS (Angular dev server)
app.cors.allowed-origins=http://localhost:4200
